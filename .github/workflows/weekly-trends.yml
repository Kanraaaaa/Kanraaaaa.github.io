name: Weekly ecosystem trends

on:
  schedule:
    # Mondays at 08:30 Asia/Shanghai (00:30 UTC), collecting the previous complete ISO week.
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "Optional ISO week to collect (for example 2026-W45). Leave blank for the previous completed week."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-trends
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect sources and generate report
        env:
          REPORT_WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$REPORT_WEEK" ]; then
            python scripts/generate_weekly_trends.py --week "$REPORT_WEEK"
          else
            python scripts/generate_weekly_trends.py
          fi

      - name: Commit and publish to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends index.html
          if git diff --cached --quiet; then
            echo "No report changes to publish."
            exit 0
          fi
          git commit -m "trends: publish weekly ecosystem report"
          git push origin HEAD:main
