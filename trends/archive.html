<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 趋势周报 · 往期归档</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090a; --panel: #0f1011; --surface: #191a1b;
  --text: #f7f8f8; --text-2: #d0d6e0; --text-3: #8a8f98; --text-4: #62666d;
  --accent: #5e6ad2; --accent-bright: #7170ff; --accent-hover: #828fff;
  --green: #27a644; --emerald: #10b981; --orange: #fb923c; --rose: #fb7185;
  --cyan: #22d3ee; --amber: #fbbf24; --violet: #a78bfa;
  --border: rgba(255,255,255,0.08); --border-subtle: rgba(255,255,255,0.05);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter','Noto Sans SC', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text-2);
  font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
body::before {
  content: ''; position: fixed; top:0; left:0; right:0; bottom:0;
  background: radial-gradient(ellipse 800px 600px at 20% 0%, rgba(94,106,210,0.08), transparent),
              radial-gradient(ellipse 600px 400px at 80% 100%, rgba(16,185,129,0.05), transparent);
  pointer-events: none; z-index: 0;
}
.container { max-width: 960px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3);
  text-decoration: none; font-size: 14px; margin-top: 32px; transition: color 0.2s; }
.back-link:hover { color: var(--accent-hover); }
header { padding: 40px 0 32px; }
header h1 { font-size: 38px; font-weight: 600; color: var(--text); letter-spacing: -1px; margin-bottom: 8px; }
header .subtitle { font-size: 17px; color: var(--text-3); }
.stats { display: flex; gap: 32px; margin-top: 24px; flex-wrap: wrap; }
.stats .stat .num { font-size: 28px; font-weight: 700; color: var(--text); }
.stats .stat .label { font-size: 13px; color: var(--text-4); }

/* Sections with divider */
section { padding: 32px 0; }
section + section { border-top: 1px solid var(--border-subtle); }
.section-title { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 4px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
.section-desc { font-size: 14px; color: var(--text-3); margin-bottom: 20px; }

/* Highlight cards (top 3) */
.highlights { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 700px) { .highlights { grid-template-columns: 1fr 1fr 1fr; } }
.highlight-card {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; text-decoration: none; transition: all 0.25s;
  display: block; position: relative; overflow: hidden;
}
.highlight-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
.highlight-card .rank { font-size: 32px; font-weight: 700; color: var(--text-4); margin-bottom: 8px; line-height: 1; }
.highlight-card .repo-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; word-break: break-all; }
.highlight-card .repo-cn { font-size: 14px; color: #a5b4fc; margin-bottom: 6px; font-weight: 600; }
.highlight-card .repo-desc { font-size: 12px; color: var(--text-3); line-height: 1.5; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.highlight-card .repo-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-4); }
.highlight-card .stars-week { color: var(--emerald); font-weight: 600; }

/* Track section */
.track-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.track-header h2 { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
.track-header .track-count { font-size: 13px; color: var(--text-4); }
.track-desc { font-size: 13px; color: var(--text-4); margin-bottom: 16px; }

/* Repo list (per track) */
.repo-list { display: flex; flex-direction: column; gap: 8px; }
.repo-card {
  background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle);
  border-radius: 8px; padding: 14px 18px; text-decoration: none; transition: all 0.2s;
  display: block;
}
.repo-card:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
.repo-card .repo-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.repo-card .repo-name { font-size: 14px; font-weight: 600; color: var(--text); }
.repo-card .repo-name:hover { color: var(--accent-hover); }
.repo-card .lang-badge { font-size: 10px; padding: 2px 7px; border-radius: 9999px; white-space: nowrap; }
.repo-card .repo-cn { font-size: 13px; color: #a5b4fc; margin-bottom: 4px; font-weight: 600; }
.repo-card .repo-desc { font-size: 12px; color: var(--text-3); line-height: 1.5; margin-bottom: 6px; }
.repo-card .repo-stats { display: flex; gap: 16px; font-size: 11px; color: var(--text-4); }
.repo-card .repo-stats .delta { color: var(--emerald); font-weight: 600; }

/* Archive list */
.archive-list { display: flex; flex-direction: column; gap: 8px; }
.archive-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border-subtle);
  border-radius: 8px; padding: 14px 20px; text-decoration: none; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
.archive-item:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
.archive-item .week-id { font-size: 15px; font-weight: 500; color: var(--text); }
.archive-item .week-date { font-size: 13px; color: var(--text-4); }

/* Archive link button */
.archive-link-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 10px 20px;
  border: 1px solid var(--border); border-radius: 8px; color: var(--text-3);
  text-decoration: none; font-size: 14px; transition: all 0.2s;
}
.archive-link-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.02); }

footer { border-top: 1px solid var(--border-subtle); padding: 40px 0; text-align: center; color: var(--text-4); font-size: 13px; margin-top: 40px; }
footer a { color: var(--text-3); text-decoration: none; }
footer a:hover { color: var(--accent-bright); }
</style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back-link">← 返回主页</a>
  <header>
    <h1>往期归档</h1>
    <p class="subtitle">GitHub 趋势周报历史报告</p>
  </header>
  <section>
    <div class="archive-list">

    <a class="archive-item" href="2026-W34.html">
      <span class="week-id">2026-W34</span>
      <span class="week-date">📈 趋势周报</span>
    </a>
    </div>
  </section>
</div>
<footer>
  <p>GitHub 趋势周报 · 由 Hermes Agent 自动生成</p>
</footer>
</body>
</html>
